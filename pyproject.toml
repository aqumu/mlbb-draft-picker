[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlbb-draft-finder"
version = "0.1.0"
description = "A transparent finder for real Mobile Legends: Bang Bang professional drafts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mlbb-draft-finder = "mlbb_draft_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

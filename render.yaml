services:
  - type: web
    name: mlbb-draft-finder-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: python scripts/start_server.py
    healthCheckPath: /v1/health

  - type: web
    name: mlbb-draft-finder-web
    runtime: static
    buildCommand: echo "Static frontend"
    staticPublishPath: ./web
